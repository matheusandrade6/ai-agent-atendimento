services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: datamind
      POSTGRES_PASSWORD: datamind
      POSTGRES_DB: datamind
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Cria o papel de aplicacao sem privilegio na primeira subida do volume.
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U datamind"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://datamind_app:datamind_app@postgres:5432/datamind
      DATABASE_ADMIN_URL: postgresql+asyncpg://datamind:datamind@postgres:5432/datamind
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

  # Worker unico: entrada, saida e cron no mesmo processo. Em producao, subir tres
  # servicos com InboundWorkerSettings, OutboundWorkerSettings e CronWorkerSettings —
  # uma rajada de 429 no envio nao pode segurar o processamento do que chega.
  worker:
    build: .
    command: arq app.workers.settings.WorkerSettings
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://datamind_app:datamind_app@postgres:5432/datamind
      DATABASE_ADMIN_URL: postgresql+asyncpg://datamind:datamind@postgres:5432/datamind
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    profiles: ["full"]

volumes:
  pgdata:
  redisdata:

# Vizinho de `pedido_humano`, que afirma o lado da equipe (handoff aberto no turno, sem
# tool, motivo certo). Aqui o que está sob teste é o lado do cliente: quem pede para falar
# com uma pessoa tem de ouvir que o pedido foi aceito. Ficar sem resposta é pior do que
# parece — por RF-28 o agente também ignora as mensagens seguintes enquanto o silêncio do
# handoff durar, então a pessoa repete o pedido no vazio e desiste.
#
# Foi `known_failure` da S11 à S25 (DEF-02): o gatilho `pedido_humano` não declara `reply`
# e a mensagem genérica do tenant só entrava em gatilho que não escala. Hoje gatilho que
# escala sem texto usa o aviso padrão do sistema, e o tenant manda na redação por
# `messages.handoff_notice` (docs/DECISOES.md, D-39). Este tenant não configura nenhum dos
# dois, de propósito: assim o cenário prova a garantia que o código dá.
scenario: pedido_humano_com_aviso
tenant: clinica-exemplo
description: >
  Quem pede para falar com uma pessoa precisa ouvir que o pedido foi aceito.

turns:
  - user: "não tô conseguindo resolver, quero falar com um atendente"
    expect:
      handoff_opened: true
      response_contains_any: ["equipe", "alguém", "já estou chamando"]

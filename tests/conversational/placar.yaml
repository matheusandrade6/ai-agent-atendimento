# Placar da suíte conversacional (seção 19.4).
#
# Uma linha por cenário. `status: pass` significa "isto funciona hoje" — se cair, o
# merge para. `assercoes` é quantas afirmações o cenário faz: diminuir esse número é
# enfraquecer o teste, e o placar obriga a fazer isso em diff aberto.
#
# `known_failure` é defeito conhecido e rastreado, com motivo obrigatório. Ele **tem**
# de continuar falhando: quando passar, a suíte manda promover a linha para `pass`.
# Cada um está descrito por inteiro em `docs/DEFEITOS.md` — causa, impacto e caminho de
# correção. O `motivo` aqui é o resumo. Hoje não há nenhum: os dois que a S11 encontrou
# foram corrigidos na S25 e as linhas viraram `pass`.
#
# Regra da 19.4: toda alteração de prompt (`app/agent/prompt.py`) roda a suíte inteira
# antes do merge — `pytest -m conversational`.
